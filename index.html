<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9d9bf">
<meta name="description" content="My bookshelf: books from Google Drive with highlights, notes and search.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Book Shelf">
<title>Book Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,700&family=Oswald:wght@400;500;600&family=Lato:wght@400;700&family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: a wall of wooden bookcase bays; each bay is one shelf of book spines that scrolls sideways.
   Search sits on top of the dashboard; bottom tab bar; details open as full-screen sheets; the reader is its own full-screen room. */
:root{
  --wall:#e9d9bf; --wall-2:#f4e8d3; --grain:rgba(120,72,24,.05);
  --back:#8a5a2b; --back-2:#a06a35; --back-grain:rgba(40,20,4,.10);
  --wood-hi:#d9a463; --wood:#b07a3c; --wood-lo:#6e4519;
  --ink:#2a1d10; --ink-2:#6d5843; --panel:#fbf6ee; --panel-2:#f1e7d8; --line:#dccab0;
  --accent:#8a2f1d; --on-accent:#ffffff; --shadow:rgba(50,26,6,.38); --glow:rgba(255,236,200,.4); --star:#c98a00;
  --danger:#b3261e; --ok:#2e7d4f;
  --f-brand:'Playfair Display',Georgia,'Times New Roman',serif;
  --f-spine:'Oswald','Hind Siliguri',Impact,'Arial Narrow',sans-serif;
  --f-ui:'Lato','Hind Siliguri',system-ui,-apple-system,sans-serif;
  --z:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --wall:#1b130d; --wall-2:#2b1d12; --grain:rgba(255,220,170,.025);
    --back:#2a1a0e; --back-2:#3a2414; --back-grain:rgba(0,0,0,.25);
    --wood-hi:#7b5130; --wood:#563620; --wood-lo:#2a170a;
    --ink:#f3e8da; --ink-2:#bba78f; --panel:#1f1711; --panel-2:#2c2118; --line:#3f3125;
    --accent:#e0a458; --on-accent:#1e1206; --shadow:rgba(0,0,0,.6); --glow:rgba(224,164,88,.22); --star:#f0c040;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --wall:#1b130d; --wall-2:#2b1d12; --grain:rgba(255,220,170,.025);
  --back:#2a1a0e; --back-2:#3a2414; --back-grain:rgba(0,0,0,.25);
  --wood-hi:#7b5130; --wood:#563620; --wood-lo:#2a170a;
  --ink:#f3e8da; --ink-2:#bba78f; --panel:#1f1711; --panel-2:#2c2118; --line:#3f3125;
  --accent:#e0a458; --on-accent:#1e1206; --shadow:rgba(0,0,0,.6); --glow:rgba(224,164,88,.22); --star:#f0c040;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background-color:var(--wall);background-image:repeating-linear-gradient(90deg,var(--grain) 0 2px,transparent 2px 9px,var(--grain) 9px 10px,transparent 10px 23px),radial-gradient(140% 55% at 50% 0%,var(--wall-2),var(--wall) 70%);background-attachment:fixed;color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;margin:0}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--wall)}
button{font:inherit;color:inherit}
button,label.btn,[data-act]{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:22px;height:22px;flex:none}
a{color:var(--accent)}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--wall);padding-block:10px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);display:grid;gap:9px}
.brand-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-brand);font-weight:700;font-size:27px;letter-spacing:.01em;line-height:1;margin:0}
.brand b{color:var(--accent);font-weight:700;font-style:italic}
.tally{font-size:12px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums;line-height:1.3}
.tally strong{color:var(--ink);font-size:14px}
.toolrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg.sm button{padding:5px 10px;font-size:12px}
.zoom{display:inline-flex;align-items:center;gap:4px;margin-left:auto}
.zoom input{width:84px;accent-color:var(--accent)}
.iconbtn{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;padding:0;flex:none}
.iconbtn svg{width:18px;height:18px}
.iconbtn[disabled]{opacity:.4}
.scroll-x{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;max-width:100%}
.scroll-x::-webkit-scrollbar{display:none}
.search{position:relative;display:block}
.search input{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:11px 40px 11px 42px;font:inherit;font-size:16px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-2);width:20px;height:20px;pointer-events:none}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:32px;height:32px;border-radius:50%;color:var(--ink-2);font-size:18px;line-height:1}

/* ---------- shelves ---------- */
main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 8px}
#shelves{touch-action:pan-x pan-y;display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
.stack{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.banner button{flex:none}
.shelf-head{display:flex;align-items:baseline;gap:8px;margin:0 2px 6px}
.shelf-head h2{font-family:var(--f-brand);font-weight:700;font-size:17px;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shelf-head .dot{width:9px;height:9px;border-radius:50%;flex:none;align-self:center}
.shelf-head .n{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.shelf-head .more{margin-left:auto;border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:2px 0;white-space:nowrap}
.bay{position:relative;z-index:0;isolation:isolate;border-radius:6px 6px 0 0;background-color:var(--back);background-image:repeating-linear-gradient(90deg,var(--back-grain) 0 1px,transparent 1px 7px,var(--back-grain) 7px 9px,transparent 9px 19px),linear-gradient(var(--back) ,var(--back-2));box-shadow:inset 0 18px 22px -12px rgba(0,0,0,.45),inset 14px 0 18px -14px rgba(0,0,0,.45),inset -14px 0 18px -14px rgba(0,0,0,.45)}
.row{display:flex;align-items:flex-end;gap:2px;overflow-x:auto;padding:18px 14px 0;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.row::-webkit-scrollbar{display:none}
.row.cv-mode{gap:10px}
.row::after{content:"";flex:0 0 10px}
.plank{height:17px;border-radius:0 0 3px 3px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 11px),linear-gradient(var(--wood-hi),var(--wood) 45%,var(--wood-lo));box-shadow:inset 0 1px 0 var(--glow),0 10px 14px -8px var(--shadow)}
.row-wrap{position:relative}
.row-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;padding:0;opacity:0;transition:opacity .2s}
.row-nav svg{width:18px;height:18px}
.row-nav.l{left:4px}.row-nav.r{right:4px}
.bay:hover .row-nav{opacity:1}
@media (hover:none){.row-nav{display:none}}

/* book spine */
.bk{flex:0 0 auto;position:relative;width:calc(var(--w)*1px*var(--z));height:calc(var(--h)*1px*var(--z));border:0;margin:0;padding:calc(10px*var(--z)) 0 calc(8px*var(--z));border-radius:2px 2px 1px 1px;color:var(--t);display:flex;flex-direction:column;align-items:center;gap:calc(5px*var(--z));scroll-snap-align:start;
  background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.16) 12%,rgba(255,255,255,0) 30%,rgba(0,0,0,0) 72%,rgba(0,0,0,.32)),var(--c);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.22),1px 0 0 rgba(0,0,0,.25);transition:transform .22s cubic-bezier(.3,.7,.3,1.2)}
.bk-band{display:block;width:100%;height:calc(3px*var(--z));background:var(--b);box-shadow:0 calc(4px*var(--z)) 0 var(--b);flex:none;opacity:.9}
.bk-band.bot{box-shadow:0 calc(-4px*var(--z)) 0 var(--b)}
.bk-title{flex:1 1 auto;min-height:0;writing-mode:vertical-rl;text-orientation:mixed;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-spine);font-size:calc(var(--fs)*var(--z));font-weight:500;letter-spacing:.03em;line-height:1.05;margin-top:calc(4px*var(--z))}
.bk-title.two{white-space:normal;text-overflow:clip;line-height:1.08;width:2.16em;flex:0 1 auto;max-height:100%}
.bk-auth{flex:none;max-height:36%;writing-mode:vertical-rl;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-ui);font-size:calc(9px*var(--z));opacity:.85;letter-spacing:.04em}
.bk-kind{position:absolute;top:calc(24px*var(--z));left:50%;transform:translateX(-50%);font-family:var(--f-ui);font-weight:700;font-size:calc(7px*var(--z));letter-spacing:.06em;padding:1px 2px;border-radius:2px;background:var(--k);color:#fff}
.bk.has-kind .bk-title{margin-top:calc(22px*var(--z))}
.bk-rib{position:absolute;top:-2px;right:calc(5px*var(--z));width:calc(7px*var(--z));height:calc(30px*var(--z));background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.bk-prog{position:absolute;left:0;bottom:0;height:calc(3px*var(--z));background:var(--t);opacity:.8}
/* spine styles */
.bk.s1{background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.12) 14%,rgba(0,0,0,0) 40%,rgba(0,0,0,.4)),var(--c)}
.bk.s1 .bk-title{font-family:var(--f-brand);font-weight:700;font-style:italic;letter-spacing:.01em;padding:calc(5px*var(--z)) 1px;background:var(--b);color:var(--c);border-radius:1px;max-width:84%}
.bk.s1 .bk-band{height:calc(2px*var(--z))}
.bk.s2{padding-top:0}
.bk.s2 .bk-band.top{height:14%;box-shadow:none;background:var(--b);opacity:1}
.bk.s2 .bk-title{font-family:var(--f-ui);font-weight:700;letter-spacing:.02em;text-transform:none}
.bk:hover{transform:translateY(-5px)}
.bk.pull{transform:translateY(calc(-28px*var(--z))) rotate(-3deg)}
.bk.missing{opacity:.45;filter:grayscale(.7)}
.bk.empty-slot{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);pointer-events:none}

/* cover mode */
.cov{flex:0 0 auto;position:relative;width:calc(104px*var(--z));aspect-ratio:2/3;max-width:100%;border:0;padding:0;border-radius:1px 4px 4px 1px;overflow:hidden;box-shadow:0 4px 10px -4px rgba(0,0,0,.6);transition:transform .22s;scroll-snap-align:start;background:var(--panel-2)}
.cov::before{content:"";position:absolute;inset:0 auto 0 0;width:7%;background:linear-gradient(90deg,rgba(0,0,0,.4),rgba(255,255,255,.2) 60%,rgba(0,0,0,.18));z-index:3}
.cov.pull,.cov:hover{transform:translateY(-6px)}
.cov.missing{opacity:.45;filter:grayscale(.7)}
.cov .cprog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.35);z-index:4}
.cov .cprog i{display:block;height:100%;background:var(--accent)}
.cov .ckind{position:absolute;top:6px;right:6px;z-index:4;font-size:9px;font-weight:700;letter-spacing:.05em;padding:2px 4px;border-radius:3px;background:var(--k);color:#fff}

/* cover art (image or designed) */
.art{position:absolute;inset:0;background:var(--c);overflow:hidden}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;background:#fff}
.art-fb{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:11% 10% 12% 14%;color:var(--t);text-align:left;
  background:radial-gradient(120% 70% at 85% 8%,rgba(255,255,255,.22),transparent 55%),linear-gradient(170deg,var(--c),var(--c2))}
.art-fb::after{content:"";position:absolute;inset:5% 5% 5% 9%;border:1px solid currentColor;opacity:.35;pointer-events:none}
.art-fb .k{font-family:var(--f-ui);font-weight:700;font-size:8px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.art-fb .tt{font-family:var(--f-brand);font-weight:700;line-height:1.08;font-size:calc(14px*var(--pf,1));overflow-wrap:break-word;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.art-fb .au{font-family:var(--f-ui);font-size:9px;font-weight:700;letter-spacing:.04em;opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lg .art-fb .tt{font-size:calc(21px*var(--pf,1))}
.lg .art-fb .k,.lg .art-fb .au{font-size:11px}

/* empty / welcome */
.empty{display:grid;gap:14px;text-align:center;padding:28px 6px}
.empty h2{font-family:var(--f-brand);margin:0;font-weight:700;font-size:24px}
.empty p{margin:0;color:var(--ink-2)}
.empty .bay .row{justify-content:center;pointer-events:none}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.nav button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--ink-2);padding:4px 0}
.nav button[aria-current="page"]{color:var(--accent)}
.nav .add{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--on-accent);margin:-22px auto 0;box-shadow:0 6px 16px -6px var(--shadow);display:grid;place-items:center}
.nav .add svg{width:26px;height:26px}

/* ---------- sheets ---------- */
#sheets{position:relative;z-index:50}
#sheets.over{z-index:70}
.sheet{position:fixed;inset:0;background:var(--panel);overflow-y:auto;overscroll-behavior:contain;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none}
.sh-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;background:var(--panel);border-bottom:1px solid var(--line);padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.sh-bar h2{flex:1;margin:0;font-size:16px;font-weight:700;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-bar .bk-btn{border:0;background:none;display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-weight:700;padding:6px 4px;min-width:64px}
.sh-bar .rt{min-width:64px;display:flex;justify-content:flex-end}
.sh-body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;display:grid;gap:18px;grid-template-columns:minmax(0,1fr);max-width:760px;margin:0 auto}

/* detail */
.d-hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:end;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,var(--c) -50%,var(--panel) 100%)}
.d-cover{position:relative;width:118px;aspect-ratio:2/3;max-width:100%;border-radius:2px 5px 5px 2px;overflow:hidden;box-shadow:0 12px 24px -10px var(--shadow)}
.d-head{min-width:0;display:grid;gap:5px}
.d-kicker{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.d-head h1{margin:0;font-family:var(--f-brand);font-weight:700;font-size:24px;line-height:1.12;text-wrap:balance;overflow-wrap:anywhere}
.d-sub{font-size:14px;color:var(--ink-2)}
.d-meta{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.d-prog{display:grid;gap:4px;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
.d-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:9px 4px;display:grid;justify-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--ink-2);text-align:center}
.act svg{width:22px;height:22px}
.act.on{color:var(--accent);border-color:var(--accent)}
.blk h3{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.blk p{margin:0}
.desc{white-space:pre-line;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.desc.open{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chip.ac{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip small{font-weight:400;color:var(--ink-2)}
.chip.ac small{color:inherit;opacity:.8}
.chip .sw{width:9px;height:9px;border-radius:50%;background:var(--tc);flex:none}
.chip.tag{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,var(--panel-2))}
.chip.tag.ac{background:var(--tc);color:#fff;border-color:var(--tc)}
.chip.tag.ac .sw{background:#fff}
.note{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:10px;padding:10px;font:inherit}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;text-decoration:none}
.btn.big{padding:12px 18px;font-size:16px;border-radius:12px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.plain{background:var(--panel-2);border-color:var(--line);color:var(--ink)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.5}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--ink-2);font-size:12px;font-weight:700;letter-spacing:.04em;padding-top:2px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* grids & lists */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px 10px}
.gcell{border:0;background:none;padding:0;text-align:left;display:grid;gap:5px;min-width:0;color:var(--ink)}
.gcell .cv{position:relative;aspect-ratio:2/3;max-width:100%;border-radius:1px 4px 4px 1px;overflow:hidden;box-shadow:0 4px 10px -5px var(--shadow)}
.gcell .cap{font-size:12px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gcell .sub{font-size:11px;color:var(--ink-2);margin-top:-3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list{display:grid;gap:2px}
.li{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;border:0;background:none;text-align:left;padding:8px 4px;border-bottom:1px solid var(--line);min-width:0;color:var(--ink);width:100%}
.li .cv{position:relative;width:44px;aspect-ratio:2/3;border-radius:1px 3px 3px 1px;overflow:hidden}
.li .cv .art-fb{padding:6px 4px 6px 6px}
.li .cv .art-fb .tt{font-size:7px;-webkit-line-clamp:4}
.li .cv .art-fb .k,.li .cv .art-fb .au,.li .cv .art-fb::after{display:none}
.li .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li > div{min-width:0}
.li .r{font-size:12px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right}
.hit{display:grid;gap:3px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:9px 4px;color:var(--ink);width:100%;min-width:0}
.hit .h1{font-size:12px;font-weight:700;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hit .h2{font-size:14px;line-height:1.4;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hit mark{background:color-mix(in srgb,var(--star) 45%,transparent);color:inherit;border-radius:2px;padding:0 1px}
.sec-title{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:0 0 6px}
.hint{font-size:13px;color:var(--ink-2);margin:0}

/* forms */
.form{display:grid;gap:12px}
.fld{display:grid;gap:4px;min-width:0}
.fld > span{font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.04em}
.fld input,.fld select,.fld textarea,.inp{width:100%;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:9px;padding:9px 10px;font:inherit;font-size:16px;min-width:0}
.fld textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.f-photo{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.f-pv{position:relative;width:96px;aspect-ratio:2/3;border-radius:1px 4px 4px 1px;overflow:hidden;box-shadow:0 6px 14px -8px var(--shadow)}
.f-photo .btns{display:grid;gap:8px;justify-items:start}
.colorlbl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink-2)}
.colorlbl input{width:40px;height:30px;border:1px solid var(--line);border-radius:6px;padding:0;background:none}
.check{display:flex;gap:10px;align-items:center;font-weight:700}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.check small{display:block;font-weight:400;color:var(--ink-2)}
.addrow{display:flex;gap:8px;align-items:center}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:9px;padding:9px 10px;font:inherit;font-size:16px}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--panel-2);display:grid;gap:10px}
.card ol{margin:0;padding-left:20px;display:grid;gap:4px}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;gap:10px;align-items:center;color:var(--ink-2);font-size:14px}
.res{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel-2);text-align:left;color:var(--ink);width:100%}
.res .cv{position:relative;width:64px;aspect-ratio:2/3;border-radius:1px 3px 3px 1px;overflow:hidden;background:var(--panel)}
.res .cv img{width:100%;height:100%;object-fit:cover;display:block}
.res .t{font-weight:700;line-height:1.25}
.res .s{font-size:12px;color:var(--ink-2);margin-top:2px}
.res.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.covpick{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.covpick button{flex:0 0 auto;width:74px;border:2px solid var(--line);border-radius:6px;padding:0;background:var(--panel-2);display:grid;gap:3px;text-align:center;font-size:11px;font-weight:700;color:var(--ink-2);overflow:hidden}
.covpick button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.covpick .cv{position:relative;aspect-ratio:2/3}
.pbar{height:8px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile b{display:block;font-family:var(--f-brand);font-weight:700;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--ink-2);font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.panel h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.vbars{display:flex;align-items:flex-end;gap:5px;height:140px;padding-top:18px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(0deg,var(--line) 0 1px,transparent 1px 35px);background-position:bottom}
.vbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;position:relative}
.vbar i{display:block;width:72%;max-width:26px;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.vbar.today i{background:var(--star)}
.vbar em{position:absolute;font-style:normal;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums}
.vlabels{display:flex;gap:5px}
.vlabels span{flex:1;text-align:center;font-size:10px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.hbars{display:grid;gap:7px}
.hb{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 3em;gap:8px;align-items:center;font-size:13px;border:0;background:none;padding:0;text-align:left;width:100%;color:var(--ink)}
.hb span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{height:10px;background:var(--panel-2);border-radius:5px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hb b{text-align:right;font-variant-numeric:tabular-nums}

/* settings */
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.th{border:2px solid var(--line);border-radius:12px;padding:0;overflow:hidden;background:var(--panel);text-align:left}
.th[aria-pressed="true"]{border-color:var(--accent)}
.th .mini{height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 10px 0}
.th .mini .sp{display:flex;gap:2px;align-items:flex-end;height:38px;padding:0 6px;border-radius:3px 3px 0 0}
.th .mini .sp i{width:8px;border-radius:1px}
.th .mini .pl{height:6px;border-radius:0 0 2px 2px}
.th .nm{display:block;padding:7px 10px;font-size:13px;font-weight:700;color:var(--ink)}
.th .nm small{font-weight:400;color:var(--ink-2)}
.fonts{display:grid;gap:6px}
.fo{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;text-align:left;color:var(--ink)}
.fo[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.fo .smp{font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fo .nm{font-size:12px;color:var(--ink-2);font-family:var(--f-ui);flex:none}
.arr{display:grid;gap:4px}
.arr-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line)}
.arr-row input{width:20px;height:20px;accent-color:var(--accent)}
.arr-row label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.arr-row label small{font-weight:400;color:var(--ink-2)}
.arr-row.off label{color:var(--ink-2);font-weight:400}
.mg-list{display:grid}
.mg-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto auto;gap:6px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line)}
.mg-row .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mg-row .nm small{display:block;font-weight:400;color:var(--ink-2);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.mg-row .n{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.mg-row .sw{width:14px;height:14px;border-radius:50%;background:var(--tc)}
.mg-row.wide{grid-template-columns:minmax(0,1fr)}
.mg-ask{display:grid;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;background:var(--tc);padding:0}
.swatches button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--panel)}
.folder-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 4px;text-align:left;color:var(--ink);width:100%}
.folder-row svg{color:var(--ink-2)}
.crumbs{display:flex;gap:4px;flex-wrap:wrap;font-size:13px}
.crumbs button{border:0;background:none;color:var(--accent);font-weight:700;padding:2px 0}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:90;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.syncbar{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:21;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 10px 24px -12px var(--shadow);display:grid;gap:6px;font-size:13px}

/* ---------- reader ---------- */
.rd{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:var(--rbg);color:var(--rfg);
  --rbg:#e7e3dc; --rfg:#1d1a16; --rbar:#faf8f4; --rline:#d7d1c6; --racc:var(--accent); --pfilter:none; --tint:transparent; --dim:0}
.rd.m-sepia{--rbg:#e3d6bc; --rfg:#3b2d1a; --rbar:#f4ead6; --rline:#d6c5a3; --tint:#f3e3c2}
.rd.m-green{--rbg:#cfe0cc; --rfg:#1e3320; --rbar:#e6f1e3; --rline:#b8cfb4; --tint:#dcefd6}
.rd.m-night{--rbg:#0e0e10; --rfg:#e6e2da; --rbar:#18181b; --rline:#2c2c31; --pfilter:invert(.9) hue-rotate(180deg) brightness(.95)}
.rd.m-dusk{--rbg:#232020; --rfg:#e8dfd2; --rbar:#2c2827; --rline:#3c3634; --pfilter:invert(.88) hue-rotate(180deg) sepia(.35) brightness(.9)}
.rd-top{display:flex;align-items:center;gap:6px;background:var(--rbar);border-bottom:1px solid var(--rline);padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:6px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));transition:transform .2s;z-index:3}
.rd-top .tt{flex:1;min-width:0;display:grid;line-height:1.2}
.rd-top .tt b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd-top .tt span{font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}
.rbtn{border:0;background:none;color:var(--rfg);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;padding:0;flex:none}
.rbtn svg{width:22px;height:22px}
.rbtn.on{color:var(--racc);background:color-mix(in srgb,var(--racc) 14%,transparent)}
.rbtn[disabled]{opacity:.35}
.rd-scroll{flex:1;overflow:auto;position:relative;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.rd-pages{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 8px 120px;transform-origin:0 0;min-width:min-content}
.rd.hz .rd-scroll{overflow-y:hidden;scroll-snap-type:x mandatory}
.rd.hz .rd-pages{flex-direction:row;align-items:center;padding:8px 0;height:100%;gap:0;min-width:0;width:max-content}
.rd.hz .pgslot{flex:0 0 var(--sw,100vw);width:var(--sw,100vw);height:100%;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;overflow:auto}
.pgslot{display:contents}
.pg{position:relative;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);flex:none;touch-action:pan-x pan-y}
.pg canvas{position:absolute;inset:0;width:100%;height:100%;filter:var(--pfilter)}
.pg::after{content:"";position:absolute;inset:0;background:var(--tint);mix-blend-mode:multiply;pointer-events:none;z-index:1}
.pg .pnum{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:13px;color:#999;font-variant-numeric:tabular-nums}
.pg svg.ann{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible}
.rd.m-night .ann .hlr,.rd.m-dusk .ann .hlr{mix-blend-mode:screen;opacity:.45}
.ann .hlr{mix-blend-mode:multiply}
.ann .flash{fill:#ffd400;opacity:.5;animation:flash 1.6s ease-out forwards}
@keyframes flash{0%{opacity:.7}100%{opacity:0}}
.pg .notes{position:absolute;inset:0;z-index:4;pointer-events:none}
.pg .nbtn{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border:0;border-radius:4px 4px 4px 0;background:var(--nc);box-shadow:0 2px 5px rgba(0,0,0,.35);pointer-events:auto;padding:0;display:grid;place-items:center;color:#1d1a16}
.pg .nbtn svg{width:14px;height:14px}
.rd.drawing .textLayer{pointer-events:none}
.rd.drawing .pg{touch-action:none;cursor:crosshair}
.rd.drawing .rd-scroll{touch-action:none}
/* pdf.js text layer */
.textLayer{position:absolute;text-align:initial;inset:0;overflow:hidden;line-height:1;-webkit-text-size-adjust:none;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:3;caret-color:CanvasText}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer span.markedContent{top:0;height:0}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:-1;cursor:default;user-select:none}
.textLayer.selecting .endOfContent{top:0}
.textLayer ::selection{background:rgba(0,90,255,.28)}
.textLayer span.found{background:rgba(255,200,0,.55);border-radius:2px}
.rd-tools{background:var(--rbar);border-top:1px solid var(--rline);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));display:grid;gap:6px;transition:transform .2s;z-index:3}
.tool-row{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none}
.tool-row::-webkit-scrollbar{display:none}
.tool{border:0;background:none;color:var(--rfg);display:grid;justify-items:center;gap:1px;font-size:10px;font-weight:700;padding:4px 5px;border-radius:10px;min-width:48px;flex:none}
.tool.ic{min-width:44px}
.tool svg{width:22px;height:22px}
.tool.on{color:var(--racc);background:color-mix(in srgb,var(--racc) 14%,transparent)}
.colors{display:flex;gap:8px;align-items:center;padding:0 4px;overflow-x:auto;scrollbar-width:none}
.colors::-webkit-scrollbar{display:none}
.cdot{width:26px;height:26px;border-radius:50%;border:2px solid transparent;background:var(--cc);padding:0;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.cdot[aria-pressed="true"]{border-color:var(--rfg);box-shadow:inset 0 0 0 2px var(--rbar)}
.mmode{display:flex;gap:4px;margin-left:auto;flex:none}
.mmode button{border:1px solid var(--rline);background:none;color:var(--rfg);height:32px;padding:0 12px;border-radius:16px;font:600 13px/1 inherit;font-family:inherit}
.mmode button[aria-pressed="true"]{border-color:var(--racc);color:var(--racc);background:color-mix(in srgb,var(--racc) 12%,transparent)}
.wsel{display:flex;gap:4px;margin-left:auto;flex:none}
.wsel button{border:1px solid var(--rline);background:none;color:var(--rfg);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;padding:0}
.wsel button[aria-pressed="true"]{border-color:var(--racc);color:var(--racc)}
.wsel i{display:block;background:currentColor;border-radius:9px;width:16px}
.rd.chrome-off .rd-top{transform:translateY(-110%);position:absolute;left:0;right:0;top:0}
.rd.chrome-off .rd-tools{transform:translateY(110%);position:absolute;left:0;right:0;bottom:0}
.rd-sel{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--rbar);color:var(--rfg);border:1px solid var(--rline);border-radius:14px;box-shadow:0 10px 26px -8px rgba(0,0,0,.45);padding:6px;display:flex;gap:4px;align-items:center;max-width:calc(100% - 24px);overflow-x:auto}
.rd-sel .cdot{width:28px;height:28px}
.rd-sel .sep{width:1px;align-self:stretch;background:var(--rline);margin:0 2px;flex:none}
.rd-sel .tool{min-width:44px}
.rd-dim{position:absolute;inset:0;background:#000;opacity:var(--dim);pointer-events:none;z-index:5}
.rd-panel{position:absolute;left:0;right:0;bottom:0;max-height:78%;z-index:8;background:var(--rbar);color:var(--rfg);border-top:1px solid var(--rline);border-radius:16px 16px 0 0;box-shadow:0 -12px 30px -10px rgba(0,0,0,.4);display:flex;flex-direction:column;transform:translateY(105%);transition:transform .24s cubic-bezier(.2,.8,.2,1)}
.rd-panel.open{transform:none}
.rp-head{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;border-bottom:1px solid var(--rline)}
.rp-head h3{flex:1;margin:0;font-size:15px}
.rp-body{overflow-y:auto;padding:12px max(14px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-right,0px));display:grid;gap:14px;align-content:start}
.rd-panel .seg{background:color-mix(in srgb,var(--rfg) 6%,transparent);border-color:var(--rline)}
.rd-panel .seg button{color:var(--rfg);opacity:.75}
.rd-panel .seg button[aria-pressed="true"]{background:var(--racc);color:var(--on-accent);opacity:1}
.rd-panel .hint{color:var(--rfg);opacity:.7}
.rd-panel .inp{background:color-mix(in srgb,var(--rfg) 6%,transparent);border-color:var(--rline);color:var(--rfg)}
.rd-panel .btn.plain{background:color-mix(in srgb,var(--rfg) 8%,transparent);border-color:var(--rline);color:var(--rfg)}
.rd-panel .hit{color:var(--rfg);border-color:var(--rline)}
.rd-panel .hit .h1{color:var(--rfg);opacity:.65}
.modes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.modes button{border:2px solid var(--rline);border-radius:10px;padding:10px 2px 6px;background:var(--mb);color:var(--mf);font-size:11px;font-weight:700;display:grid;justify-items:center;gap:2px}
.modes button b{font-family:var(--f-brand);font-size:18px}
.modes button[aria-pressed="true"]{border-color:var(--racc)}
.rrow{display:flex;align-items:center;gap:10px}
.rrow label{font-size:13px;font-weight:700;min-width:5.5em}
.rrow input[type=range]{flex:1;accent-color:var(--racc)}
.toc{display:grid}
.toc button{border:0;background:none;text-align:left;color:var(--rfg);padding:8px 2px;border-bottom:1px solid var(--rline);font-size:14px;display:flex;gap:8px;justify-content:space-between}
.toc button span:last-child{opacity:.6;font-variant-numeric:tabular-nums;flex:none}
.rd-load{position:absolute;inset:0;z-index:7;display:grid;place-items:center;background:var(--rbg)}
.rd-load .box{display:grid;gap:10px;justify-items:center;text-align:center;padding:20px;max-width:340px;width:100%}
.rd-load .pbar{width:100%}
.doc-view{max-width:760px;margin:0 auto;padding:18px max(18px,env(safe-area-inset-left,0px)) 140px max(18px,env(safe-area-inset-right,0px));font-size:var(--dfs,17px);line-height:1.6;color:var(--rfg);overflow-wrap:anywhere}
.doc-view img{max-width:100%;height:auto}
.doc-view h1,.doc-view h2,.doc-view h3,.doc-view h4{line-height:1.25;margin:1.2em 0 .5em;text-wrap:balance}
.doc-view h1{font-size:1.55em}.doc-view h2{font-size:1.3em}.doc-view h3{font-size:1.12em}.doc-view h4{font-size:1em}
.doc-view table{border-collapse:collapse;max-width:100%;display:block;overflow-x:auto}
.doc-view td,.doc-view th{border:1px solid var(--rline);padding:4px 8px;vertical-align:top}
.sheet-tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid var(--rline);background:var(--rbar)}
.sheet-tabs button{border:1px solid var(--rline);background:none;color:var(--rfg);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.sheet-tabs button[aria-pressed="true"]{background:var(--racc);border-color:var(--racc);color:var(--on-accent)}
.xl-wrap{overflow:auto;padding:10px;font-size:var(--dfs,14px)}
.xl-wrap table{border-collapse:collapse;background:color-mix(in srgb,var(--rbar) 70%,transparent)}
.xl-wrap td,.xl-wrap th{border:1px solid var(--rline);padding:5px 9px;white-space:nowrap;color:var(--rfg)}
.xl-wrap tr:first-child td{font-weight:700;position:sticky;top:-10px;background:var(--rbar)}
.frame-wrap{display:grid;grid-template-rows:auto 1fr;height:100%}
.frame-wrap iframe{width:100%;height:100%;border:0;background:#fff}
.rd-msg{display:grid;gap:12px;justify-items:center;text-align:center;padding:40px 20px;max-width:420px;margin:0 auto}
@media (min-width:700px){ .d-cover{width:160px} .d-head h1{font-size:32px} .tiles{grid-template-columns:repeat(4,1fr)} .themes{grid-template-columns:repeat(4,1fr)} .rd-panel{left:auto;right:16px;bottom:16px;width:420px;border-radius:16px;max-height:80%} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

/* clean a file name into a readable title */

  s = s.replace(/\b(z-?lib(\.org)?|libgen(\.\w+)?|ebook3000|pdfdrive|www\.\S+)\b/gi, ' ');

/* ---------- categories & tags ---------- */
function addCat(name, folderId) {
  name = String(name || '').trim(); if (!name) return null;
  let c = folderId ? META.cats.find(x => x.folderId === folderId) : null;
  if (!c) c = META.cats.find(x => sameName(x.name, name) && (!folderId || !x.folderId));
  if (c) { if (folderId && !c.folderId) { c.folderId = folderId; saveMeta(); } return c; }
  c = { id: uid('c'), name }; if (folderId) c.folderId = folderId;
  META.cats.push(c); saveMeta(); return c;
}
function addTag(name, color) {
  name = String(name || '').trim(); if (!name) return null;
  let t = META.tags.find(x => sameName(x.name, name)); if (t) return t;
  t = { id: uid('t'), name, color: color || TAG_COLORS.find(c => !META.tags.some(x => x.color === c)) || TAG_COLORS[META.tags.length % TAG_COLORS.length] };
  META.tags.push(t); saveMeta(); return t;
}

/* ---------- reading time ---------- */
function addReading(sec, book) {
  if (sec <= 0) return;
  const k = today(); STATS.days[k] = Math.round(((STATS.days[k] || 0) + sec / 60) * 10) / 10;
  const keys = Object.keys(STATS.days).sort(); while (keys.length > 400) delete STATS.days[keys.shift()];
  if (book) { book.readSec = (book.readSec || 0) + sec; saveBookSoon(book); }
  statsDirty = true; saveStats();
}

/* ---------- sync the Drive folder into the shelf ---------- */
let syncing = false;
async function syncDrive(opts = {}) {
  if (!CLOUD || syncing) return;
  if (!META.root) { if (!opts.quiet) openFolderPicker(); return; }
  syncing = true;
  const bar = t => syncbar(`<div class="loading"><span class="spinner"></span><span>${esc(t)}</span></div>`);
  try {
    bar('Reading your Google Drive folder…');
    const root = META.root.id; const files = []; const queue = [{ id: root, top: null, path: '' }]; let folders = 0;
    while (queue.length) {
      const f = queue.shift(); const kids = await listChildren(f.id);
      for (const k of kids) {
        if (k.mimeType === 'application/vnd.google-apps.folder') {
          folders++; let top = f.top;
          if (!top) { const c = addCat(k.name, k.id); if (c && c.name !== k.name && c.folderId === k.id) { c.name = k.name; saveMeta(); } top = k.id; }
          queue.push({ id: k.id, top, path: (f.path ? f.path + ' / ' : '') + k.name });
        } else if (kindOf(k.mimeType, k.name)) files.push(Object.assign({}, k, { top: f.top, path: f.path }));
      }
      bar(`Reading your Google Drive folder… ${files.length} files in ${folders} folders`);
    }
    const seen = new Set(); const fresh = [], changed = [];
    for (const f of files) {
      seen.add(f.id);
      const cat = f.top ? META.cats.find(c => c.folderId === f.top) : null;
      let b = byId(f.id);
      if (!b) {
        b = newBook({ id: f.id, driveId: f.id, src: 'drive', name: f.name, mime: f.mimeType, size: +f.size || 0, folderId: (f.parents || [])[0] || '', path: f.path, modified: f.modifiedTime, cats: cat ? [cat.id] : [] });
        fresh.push(b);
      } else {
        let ch = false;
        if (b.name !== f.name) { b.name = f.name; if (b.titleAuto) b.title = cleanTitle(f.name); ch = true; }
        if (b.missing) { b.missing = false; ch = true; }
        if ((+f.size || 0) !== (b.size || 0)) { b.size = +f.size || 0; ch = true; }
        if (b.path !== f.path) { b.path = f.path; ch = true; }
        if (b.modified !== f.modifiedTime) { if (b.modified) { b.coverTried = false; IDB.del('files', b.id); IDB.del('text', b.id); } b.modified = f.modifiedTime; ch = true; }
        if (cat && !b.cats.includes(cat.id) && !b.catsManual) { b.cats.push(cat.id); ch = true; }
        if (ch) changed.push(b);
      }
    }
    BOOKS.filter(b => b.src === 'drive' && !seen.has(b.id) && !b.missing).forEach(b => { b.missing = true; changed.push(b); });
    if (fresh.length) BOOKS.push(...fresh);
    bar('Saving your shelf…');
    await Store.saveBooks(fresh.concat(changed));
    META.lastSync = Date.now(); saveMeta();
    syncbar(''); renderAll();
    const gone = changed.filter(b => b.missing).length;
    toast(fresh.length ? `${fresh.length} new ${fresh.length === 1 ? 'book' : 'books'} added` + (gone ? `, ${gone} missing from Drive` : '') : gone ? `${gone} ${gone === 1 ? 'book is' : 'books are'} missing from Drive` : 'Your shelf is up to date');
    queueCovers();
  } catch (e) { syncbar(''); if (!opts.quiet) toast(driveErr(e)); }
  finally { syncing = false; }
}

function norm(s) { return String(s ?? '').toLowerCase().normalize('NFKC').replace(/[^\p{L}\p{M}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim(); }

  const draw = (p) => { if (R.sseq !== seq) return; box.innerHTML = `<p class="hint">${hits.length} ${hits.length === 1 ? 'page' : 'pages'}${p < R.n ? ` · searched ${p} of ${R.n} pages…` : ''}</p>` + hits.slice(0, 300).map(h => `<button class="hit" data-r="gotoFind" data-p="${h.p}"><span class="h1">Page ${h.p}</span><span class="h2">${snippet(h.s, q, 60)}</span></button>`).join(''); };

async function indexAll(btn) {
  const list = BOOKS.filter(b => b.kind === 'pdf' && !b.missing); const have = new Set(await IDB.keys('text'));
  const todo = list.filter(b => !have.has(b.id)); if (!todo.length) { toast('Every book is already searchable'); return; }
  await needLib('pdf'); btn.disabled = true; let n = 0;
  for (const b of todo) {
    n++; syncbar(`<div class="loading"><span class="spinner"></span><span>Making books searchable · ${n} of ${todo.length}: ${esc(b.title)}</span></div>`);
    try {
      const c = await getContent(b, null, false); if (c.as !== 'pdf') continue;
      const doc = await pdfjsLib.getDocument({ data: c.bytes, isEvalSupported: false }).promise; const pages = [];
      for (let p = 1; p <= doc.numPages; p++) { const tc = await (await doc.getPage(p)).getTextContent(); pages.push(tc.items.map(i => i.str + (i.hasEOL ? '\n' : ' ')).join('').replace(/[ \t]+/g, ' ').trim()); }
      await IDB.put('text', { id: b.id, n: doc.numPages, done: doc.numPages, pages, at: Date.now() }); if (!b.pageCount) { b.pageCount = doc.numPages; saveBookSoon(b); }
      doc.destroy();
    } catch (e) { if (e.message === 'auth') { toast(driveErr(e)); break; } }
  }
  syncbar(''); toast('Done'); if (S.view === 'settings') renderSettings();
}
async function backupJSON() { const marks = CLOUD ? await Store.allMarks() : await Store.allMarks(); return JSON.stringify({ app: 'BookShelf', version: 1, exportedAt: new Date().toISOString(), meta: META, stats: STATS, books: BOOKS.filter(b => !b.example), marks: marks.filter(m => byId(m.bookId) && !byId(m.bookId).example) }); }
async function restoreFrom(file) {
  try {
    const j = JSON.parse(await file.text()); if (!j || j.app !== 'BookShelf' || !Array.isArray(j.books)) throw new Error('bad');
    if (j.meta) { META = Object.assign(DEFAULT_META(), j.meta); await Store.saveMeta(); }
    if (j.stats) { STATS = j.stats; Store.saveStats(); }
    const books = j.books.filter(b => b && b.id && b.title); books.forEach(b => { const k = BOOKS.findIndex(x => x.id === b.id); if (k >= 0) BOOKS[k] = b; else BOOKS.push(b); });
    await Store.saveBooks(books);
    for (const m of (j.marks || [])) await Store.saveMarks(m.bookId, m.page, m.items || []);
    MARKS_CACHE = null; renderAll(); toast(`Restored ${books.length} books`);
  } catch (e) { toast('That file is not a Book Shelf backup'); }
}

const armed = new WeakMap();

/* pinch to resize the shelves */
(() => {
  let d0 = 0, z0 = 1; const box = $('#shelves');
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  box.addEventListener('touchstart', e => { if (e.touches.length === 2) { d0 = dist(e.touches); z0 = S.zoom; } }, { passive: true });
  box.addEventListener('touchmove', e => { if (e.touches.length === 2 && d0) { e.preventDefault(); setZoom(z0 * dist(e.touches) / d0); } }, { passive: false });

})();

(async function start() {

      IDB.putMany('books', BOOKS.map(clean));
      renderAll();
      Store.allMarks().then(m => { MARKS_CACHE = m; }).catch(() => {});
      if (Drive.valid()) { if (S.autoSync && META.root && Date.now() - (META.lastSync || 0) > 10 * 60e3) syncDrive({ quiet: true }); queueCovers(); }
    });
  } else {
    await LocalStore.init();
    showView('home');
    queueCovers();
  }
  if (!FRAMED && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
